[build]
builder = "RAILPACK"
buildCommand = "cd backend && npm ci --include=dev && npm run build"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "cd backend && npm run start:prod"
healthcheckPath = "/api"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
